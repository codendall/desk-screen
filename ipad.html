<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Desk">
<title>Desk</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#fff}
#wrap{position:absolute;left:50%;top:50%;width:800px;height:480px;-webkit-transform-origin:0 0;transform-origin:0 0}
iframe{width:800px;height:480px;border:0;display:block;background:#fff}
#st{position:fixed;right:8px;bottom:4px;font:11px -apple-system,Helvetica,Arial,sans-serif;color:#999}
</style></head><body>
<div id="wrap"><iframe id="f" src="index.html" scrolling="no"></iframe></div>
<div id="st"></div>
<script>
// Shows the Today desk page (index.html) scaled to fill the iPad, and reloads it every 15 minutes.
function fit(){
  var w=window.innerWidth,h=window.innerHeight,s=Math.min(w/800,h/480);
  var el=document.getElementById('wrap');
  var t='scale('+s+') translate(-50%,-50%)';
  el.style.webkitTransform=t; el.style.transform=t;
}
function reload(){
  document.getElementById('f').src='index.html?t='+Date.now();
  var d=new Date(); document.getElementById('st').textContent='Checked '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}
window.addEventListener('resize',fit); window.addEventListener('orientationchange',function(){setTimeout(fit,300)});
fit(); reload(); setInterval(reload,15*60*1000);
</script>
</body></html>
