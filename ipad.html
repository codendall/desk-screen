<style>
/* iPad desk view. Reads the Today page (index.html), which the morning task updates,

*{box-sizing:border-box;margin:0;padding:0}

  background:#f6f1e9;color:#1f1d1a;font-family:Inter,-apple-system,Helvetica,Arial,sans-serif;padding:26px 30px 22px}

.pts{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin:0 18px}

.ptxt .num{font-family:Fraunces,Georgia,serif;font-size:40px;font-weight:700;line-height:1;color:#1f1d1a}
.ptxt .num small{font-family:Inter,sans-serif;font-size:13px;font-weight:600;color:#9a8f83;margin-left:4px}
.bar{height:9px;border-radius:6px;background:#ece4d8;margin:7px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb020,#e0603f);border-radius:6px;-webkit-transition:width .5s;transition:width .5s}
.goal{font-size:12px;color:#6d655c}
.goal b{color:#e0603f;cursor:pointer}
#pop{position:fixed;font:800 28px Fraunces,Georgia,serif;color:#e0603f;pointer-events:none;opacity:0;z-index:60}
#pop.go{-webkit-animation:pop 1s ease-out;animation:pop 1s ease-out}
@-webkit-keyframes pop{0%{opacity:1;-webkit-transform:translateY(0) scale(.8)}100%{opacity:0;-webkit-transform:translateY(-60px) scale(1.3)}}
@keyframes pop{0%{opacity:1;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-60px) scale(1.3)}}

#focusbtn{margin-top:10px;border:0;background:#2f6b4f;color:#fff;font:600 15px Inter,-apple-system,Helvetica,sans-serif;padding:7px 16px;border-radius:18px;-webkit-tap-highlight-color:transparent}
#focus{position:absolute;left:0;top:0;width:1024px;height:768px;background:#203a2e;color:#f6f1e9;z-index:50;display:none;text-align:center;padding:60px 80px}
#focus .fx{position:absolute;right:28px;top:18px;font-size:44px;line-height:1;color:#9fb8aa;padding:6px 12px}
.fq{font:700 34px Fraunces,Georgia,serif;margin:10px 0 22px}
#fopts span{display:block;background:rgba(255,255,255,.08);border-radius:16px;padding:12px 20px;margin:0 auto 10px;max-width:640px;font-size:20px;font-weight:500;text-align:left}
#fopts span.on{background:#f6f1e9;color:#203a2e}
.flen{margin-top:18px}.flen span{display:inline-block;border:2px solid #6f8f7f;border-radius:22px;padding:9px 20px;margin:0 6px;font-size:18px;font-weight:600;color:#cfe0d6}
.flen span.on{background:#e8b14a;border-color:#e8b14a;color:#203a2e}
#fgo{display:inline-block;margin-top:22px;background:#e8b14a;color:#203a2e;border-radius:30px;padding:14px 46px;font-size:22px;font-weight:700}
#frun{display:none;padding-top:40px}
.flab{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#9fb8aa;font-weight:700}
#ftask{font:700 40px Fraunces,Georgia,serif;margin:16px auto 10px;max-width:800px;line-height:1.15}
#ftime{font:700 190px Fraunces,Georgia,serif;letter-spacing:-6px;line-height:1;margin:20px 0 18px;font-variant-numeric:tabular-nums}
.fbar{height:10px;background:rgba(255,255,255,.12);border-radius:6px;max-width:620px;margin:0 auto;overflow:hidden}.fbar i{display:block;height:100%;width:0;background:#e8b14a;border-radius:6px}
.fbtns{margin-top:40px}.fbtns span{display:inline-block;border:2px solid #6f8f7f;border-radius:28px;padding:12px 28px;margin:0 8px;font-size:20px;font-weight:600;color:#e3eee8}
.fbtns span.fgo{background:#e8b14a;border-color:#e8b14a;color:#203a2e}
#fmsg{margin-top:26px;font-size:20px;color:#e8b14a;min-height:26px}
#focus.ding{-webkit-animation:ding 1s 3;animation:ding 1s 3}
@-webkit-keyframes ding{50%{background:#3f7a5e}}@keyframes ding{50%{background:#3f7a5e}}
</style></head><body>
<div id="night"></div>
<div id="pop">+10</div>
<div id="undo"><span id="undot"></span><b id="undob">Undo</b></div>
<div id="stage">
  <div class="top">
    <div><div class="clock" id="date"></div><div class="date" id="sub"></div><button id="focusbtn">&#9673; Focus</button></div>
    <div class="pts"><button id="bigred">BORING<br>THING<br>DONE</button><div class="ptxt"><div class="num" id="pnum">0<small>pts</small></div><div class="bar"><i id="pbar" style="width:0"></i></div><div class="goal" id="pgoal"></div></div></div>
    <div class="wx" id="wx"></div>
  </div>
  <div class="grid">
    <div class="col l">
      <div class="card" style="-webkit-flex:1;flex:1;overflow:hidden;margin-bottom:0"><h2><span>Today</span><span id="nextin"></span></h2><div id="today"></div><div id="tom" style="display:none"></div></div>
      <div class="card" style="margin:16px 0 0"><h2><span>Reply today</span><span class="n" id="rn">0</span></h2><div class="chips" id="reply"></div></div>
    </div>
    <div class="col r">
      <div class="card"><h2><span>Do now</span><span class="hint">tap to tick</span></h2><ol id="donow"></ol></div>
      <div class="card" style="margin-bottom:0"><h2><span>Due soon</span></h2><ul class="due" id="due"></ul></div>
      <div class="card" id="listsc" style="margin:14px 0 0;-webkit-flex:1;flex:1;overflow:hidden;padding-top:12px;padding-bottom:6px;display:none"><h2><span>Lists</span><span class="hint">from Reminders</span></h2><div id="lists"></div></div>

    </div>
    <div class="col wk">
      <div class="card" style="-webkit-flex:1;flex:1;overflow:hidden;margin-bottom:0"><h2><span>Rest of the week</span><span class="hint">tap to tick</span></h2><div id="week"></div></div>
    </div>
  </div>
  <div id="focus">
    <div class="fx" id="fexit">&times;</div>
    <div id="fpick"><div class="fq">What are you doing now?</div><div id="fopts"></div>
      <div class="flen"><span data-m="15">15 min</span><span data-m="25" class="on">25 min</span><span data-m="45">45 min</span><span data-m="60">60 min</span></div><div id="fgo">Start</div></div>
    <div id="frun"><div class="flab">Just this</div><div id="ftask"></div><div id="ftime">25:00</div><div class="fbar"><i id="fprog"></i></div>
      <div class="fbtns"><span id="fpause">Pause</span><span id="fmore">+5 min</span><span id="fdone" class="fgo">Done &#10003;</span></div>
      <div id="fmsg"></div></div>
  </div>
  <div class="foot"><span id="upd"></span><span id="chk"></span></div>
</div>
<script>
var MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function $(id){return document.getElementById(id)}
function txt(el){return el?el.textContent.replace(/\s+/g,' ').trim():''}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function pad(n){return ('0'+n).slice(-2)}
function mins(hm){var m=/(\d{1,2}):(\d{2})/.exec(hm);return m?(+m[1])*60+(+m[2]):null}
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min(w/1024,h/768);var x=Math.round((w-1024*s)/2),y=Math.round((h-768*s)/2);var t='translate('+x+'px,'+y+'px) scale('+s+')';var st=$('stage').style;st.webkitTransform=t;st.transform=t}
var data=null,week=null;
function renderWeek(){var el=$('week');if(!week||!week.days){el.innerHTML='<div class="empty">Week not available yet</div>';return}
  var now=new Date(),today=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate()),h='',n=0;
  for(var i=0;i<week.days.length&&n<7;i++){var d=week.days[i];if(d.date<=today)continue;n++;
    var items=d.items.slice().sort(function(a,b){return (a.t||'00:00')<(b.t||'00:00')?-1:1});
    h+='<div class="wd"><div class="dl">'+esc(d.label)+'</div>';
    for(var j=0;j<items.length;j++){var it=items[j];h+='<div class="it tap '+(it.k||'')+'" data-k="'+esc(key(d.date+' '+it.t+' '+it.w))+'"><span class="tt">'+esc(it.t||'')+'</span><span class="ww">'+esc(it.w)+'</span></div>'}
    h+='</div>'}
  el.innerHTML=h||'<div class="empty">Nothing coming up</div>';renderLists();bindTicks()}
function renderLists(){var L=week&&week.lists,h='',G=[['work','Work',''],['shopping','Shopping','shop'],['family','Family','fam']];
  if(L){for(var i=0;i<G.length;i++){var a=L[G[i][0]]||[];if(!a.length)continue;h+='<div><span class="lst">'+G[i][1]+'</span><div class="chips '+G[i][2]+'">';
    for(var j=0;j<a.length;j++)h+='<span class="tap" data-k="'+esc(key('list '+G[i][0]+' '+a[j]))+'">'+esc(a[j])+'</span>';h+='</div></div>'}}
  $('lists').innerHTML=h;$('listsc').style.display=h?'block':'none';document.body.className=h?'compact':''}
function parse(html){
  var d=new DOMParser().parseFromString(html,'text/html');
  var o={date:txt(d.querySelector('h1')),events:[],tom:'',donow:[],reply:[],rn:'',due:[]};
  var svg=d.querySelector('.wxbox svg');o.svg=svg?svg.outerHTML:'';
  var lv=d.querySelector('.wxt .lv'),tp=d.querySelector('.wxt .tp'),wxt=d.querySelector('.wxt');
  o.leave=txt(lv);o.temp=txt(tp);
  var cd='';if(wxt){var parts=wxt.innerHTML.split(/<br\s*\/?>/i);if(parts[1]){var tmp=document.createElement('div');tmp.innerHTML=parts[1];cd=txt(tmp)}}o.cond=cd;
  var st=d.querySelector('.stamp');o.upd='';if(st){var m=/Updated\s+\d{1,2}:\d{2}/.exec(st.textContent);if(m)o.upd=m[0]}
  var notes=d.querySelectorAll('.stamp > b');o.note=notes.length?txt(notes[0]):'';
  var evs=d.querySelectorAll('.ev');for(var i=0;i<evs.length;i++){var e=evs[i];var w=e.querySelector('.w');var flags=[];
    var fl=w?w.querySelectorAll('.flag'):[];for(var j=0;j<fl.length;j++){flags.push({t:txt(fl[j]),y:/\by\b/.test(fl[j].className)})}
    var wc=w?w.cloneNode(true):null;if(wc){var ff=wc.querySelectorAll('.flag');for(var k=0;k<ff.length;k++)ff[k].parentNode.removeChild(ff[k])}
    o.events.push({t:txt(e.querySelector('.t')),w:txt(wc),home:/\bhome\b/.test(e.className),flags:flags})}
  var tom=d.querySelector('.tom');o.tom=tom?tom.innerHTML:'';
  var li=d.querySelectorAll('ol li');for(i=0;i<li.length;i++)o.donow.push(txt(li[i]));
  var rp=d.querySelector('.reply');if(rp)o.reply=txt(rp).split(' · ');
  var rn=d.querySelector('h2 .n');o.rn=txt(rn);
  var ul=d.querySelectorAll('ul li');for(i=0;i<ul.length;i++){var sp=ul[i].querySelector('span');var dd=txt(sp);var rest=txt(ul[i]).slice(dd.length).trim();o.due.push({d:dd,w:rest,soon:/\bsoon\b/.test(ul[i].className)})}
  return o;
}
function daysUntil(label){
  var m=/(\w{3})\s+(\d{1,2})/.exec(label);if(!m)return null;var now=new Date();var dn=+m[2];
  var t=new Date(now.getFullYear(),now.getMonth(),dn);if(t<new Date(now.getFullYear(),now.getMonth(),now.getDate()))t=new Date(now.getFullYear(),now.getMonth()+1,dn);
  return Math.round((t-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
}
var TICK={};try{TICK=JSON.parse(localStorage.getItem('deskTicks')||'{}')}catch(e){TICK={}}
function saveT(){try{localStorage.setItem('deskTicks',JSON.stringify(TICK))}catch(e){}}
function key(k){return k.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
var FORM='https://docs.google.com/forms/d/e/1FAIpQLScsI5HxK3wOA4bIspmBXABj46fzuiB5VtQLAlR7K_G63aC84Q/formResponse';
function label(el){var c=el;while(c&&!/\bcard\b/.test(c.className||''))c=c.parentNode;var sec=c?txt(c.querySelector('h2 span')):'';
  var day='';var w=el.parentNode;if(w&&/\bwd\b/.test(w.className||''))day=txt(w.querySelector('.dl'))+' · ';
  var t=(el.innerText||el.textContent).replace(/\b(Now|Next|CLASH|REPLY)\b/g,'').replace(/\s+/g,' ').trim();
  var n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())+' · '+sec+' · '+day+t}
function send(text){try{var i=new Image();i.src=FORM+'?entry.113233410='+encodeURIComponent(text)+'&submit=Submit&t='+Date.now()}catch(e){}}
var undoT=null,undoFn=null;
function showUndo(txt0,fn){$('undot').textContent='Ticked: '+txt0.slice(0,40);undoFn=fn;$('undo').style.display='block';clearTimeout(undoT);undoT=setTimeout(function(){$('undo').style.display='none';undoFn=null},6000)}
function bindTicks(){var els=document.querySelectorAll('[data-k]');for(var i=0;i<els.length;i++){(function(el){var k=el.getAttribute('data-k');
  if(TICK[k]){if(typeof TICK[k]!=='object'){TICK[k]={t:TICK[k],s:1};send('DONE · '+label(el));saveT()}el.className+=' gone'}
  el.onclick=function(ev){var l=label(el);TICK[k]={t:Date.now(),s:1};saveT();send('DONE · '+l);addPts(5,'ticked',(ev&&ev.clientX)||500,(ev&&ev.clientY)||300);el.className+=' done';
    setTimeout(function(){if(TICK[k])el.className+=' gone'},700);
    showUndo((el.innerText||'').replace(/\s+/g,' ').trim(),function(){delete TICK[k];saveT();send('UNDO · '+l);PTS=Math.max(0,PTS-5);savePts();drawPts();el.className=el.className.replace(/\s*(done|gone)/g,'')})}})(els[i])}}
function render(){
  var now=new Date();
  if(!data){$('date').textContent='';return}
  $('date').textContent=data.date;$('sub').textContent=data.note||'';
  $('wx').innerHTML=data.svg+'<div><div class="lv">'+esc(data.leave)+'</div><div class="tp">'+esc(data.temp)+'</div><div class="cd">'+esc(data.cond)+'</div></div>';
  var nm=now.getHours()*60+now.getMinutes(),h='',nextShown=false,nextIn='';
  for(var i=0;i<data.events.length;i++){var e=data.events[i];var s=mins(e.t);var parts=e.t.split(/[–-]/);var en=parts[1]?mins(parts[1]):(s!==null?s+60:null);
    var cls='ev'+(e.home?' home':''),badge='';
    if(s!==null&&en!==null&&nm>=en)cls+=' past';
    else if(s!==null&&nm>=s&&nm<en){cls+=' now';badge='<span class="badge">Now</span>'}
    else if(s!==null&&!nextShown&&s>nm){nextShown=true;var dm=s-nm;badge='<span class="badge next">Next</span>';nextIn=dm<60?'in '+dm+' min':'in '+Math.floor(dm/60)+' h '+pad(dm%60)}
    var tags='';for(var j=0;j<e.flags.length;j++)tags+='<span class="tag'+(e.flags[j].y?'':' r')+'">'+esc(e.flags[j].t)+'</span>';
    h+='<div class="'+cls+' tap" data-k="'+esc(key(e.t+' '+e.w))+'"><div class="t">'+esc(e.t)+'</div><div class="w">'+esc(e.w)+tags+badge+'</div></div>'}
  $('today').innerHTML=h||'<div class="empty">Nothing else today</div>';$('nextin').textContent=nextIn;
  var tomh=(data.tom||'').replace(/<span style="[^"]*">/g,'<span class="hot">').split(/<br\s*\/?>/i).map(function(p){return '<p>'+p+'</p>'}).join('');
  $('tom').innerHTML='<h2><span>Coming up</span></h2>'+tomh;
  h='';for(i=0;i<data.donow.length;i++)h+='<li class="tap" data-k="'+esc(key(data.donow[i]))+'" data-n="'+(i+1)+'">'+esc(data.donow[i])+'</li>';$('donow').innerHTML=h;
  $('rn').textContent=data.rn||data.reply.length;h='';for(i=0;i<data.reply.length;i++)if(data.reply[i])h+='<span class="tap" data-k="'+esc(key(data.reply[i]))+'">'+esc(data.reply[i])+'</span>';$('reply').innerHTML=h;
  h='';for(i=0;i<data.due.length;i++){var u=data.due[i];var dd=daysUntil(u.d);var inn=dd===null?'':dd===0?'today':dd===1?'tomorrow':'in '+dd+' days';
    h+='<li class="tap '+(u.soon?'soon':'')+'" data-k="'+esc(key(u.w))+'"><span class="d">'+esc(u.d)+'</span><span class="w">'+esc(u.w)+'</span><span class="in">'+inn+'</span></li>'}
  $('due').innerHTML=h;
  renderWeek();
  $('upd').textContent=data.upd?data.upd+' by the morning brief':'';bindTicks();
}
function load(){
  var x=new XMLHttpRequest();x.open('GET','index.html?t='+Date.now(),true);
  x.onload=function(){if(x.status==200){try{data=parse(x.responseText)}catch(e){}}render();var d=new Date();$('chk').textContent='Checked '+pad(d.getHours())+':'+pad(d.getMinutes())};
  x.onerror=function(){render()};x.send();
  var y=new XMLHttpRequest();y.open('GET','week.json?t='+Date.now(),true);y.onload=function(){if(y.status==200){try{week=JSON.parse(y.responseText)}catch(e){}}renderWeek()};y.send();
}
window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,300)});
// Night mode: black screen 19:30-07:30 (looks off); tap shows the desk for 60 s.
var NIGHT_FROM=19*60+30,NIGHT_TO=7*60+30,peekUntil=0;
function nightCheck(){var n=new Date(),m=n.getHours()*60+n.getMinutes();var night=(m>=NIGHT_FROM||m<NIGHT_TO)&&Date.now()>peekUntil;$('night').style.display=night?'block':'none'}
$('night').addEventListener('click',function(){peekUntil=Date.now()+60000;nightCheck()});
setInterval(nightCheck,15000);nightCheck();
// Points: big red button +10, each tick +5. Saved on the iPad and logged to the Desk ticks sheet.
var GOAL=100,PTS=0;try{PTS=parseInt(localStorage.getItem('deskPts')||'0',10)||0}catch(e){}
function savePts(){try{localStorage.setItem('deskPts',String(PTS))}catch(e){}}
function drawPts(){$('pnum').innerHTML=PTS+'<small>pts</small>';var r=Math.min(100,Math.round(PTS%GOAL/GOAL*100));if(PTS>=GOAL)r=100;$('pbar').style.width=r+'%';
  $('pgoal').innerHTML=PTS>=GOAL?'Treat unlocked! <b id="spend">Spend '+GOAL+'</b>':(GOAL-PTS)+' to your next treat';
  var sp=document.getElementById('spend');if(sp)sp.onclick=function(){if(confirmSpend()){PTS-=GOAL;savePts();send('SPEND · -'+GOAL+' · treat');drawPts()}}}
function confirmSpend(){var b=$('pgoal');if(b.getAttribute('data-c')){b.removeAttribute('data-c');return true}b.setAttribute('data-c','1');b.innerHTML='Tap again to spend <b id="spend">'+GOAL+' pts</b>';var sp=document.getElementById('spend');sp.onclick=function(){if(confirmSpend()){PTS-=GOAL;savePts();send('SPEND · -'+GOAL+' · treat');drawPts()}};setTimeout(function(){b.removeAttribute('data-c');drawPts()},4000);return false}
function addPts(n,why,x,y){PTS+=n;savePts();send('POINTS · +'+n+' · '+why);drawPts();var p=$('pop');p.textContent='+'+n;p.style.left=(x-20)+'px';p.style.top=(y-30)+'px';p.className='';void p.offsetWidth;p.className='go'}
$('bigred').addEventListener('click',function(e){var b=$('bigred');b.className='hit';setTimeout(function(){b.className=''},150);addPts(10,'boring thing done',e.clientX||500,e.clientY||100)});
drawPts();
$('undob').addEventListener('click',function(){if(undoFn)undoFn();$('undo').style.display='none';undoFn=null});
fit();load();setInterval(render,30*1000);setInterval(load,10*60*1000);
// Reload the whole page once a night so any design update arrives.
setTimeout(function(){location.reload()},(function(){var n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,4,0);return t-n})());

// ---- Focus mode: one task, one timer, nothing else on screen ----
var F=null,fSel='',fLen=25,fTick=null,actx=null;
try{F=JSON.parse(localStorage.getItem('deskFocus')||'null')}catch(e){}
function fSave(){try{localStorage.setItem('deskFocus',JSON.stringify(F))}catch(e){}}
function fOpts(){var o=[],seen={};function add(t){t=(t||'').replace(/\s+/g,' ').trim();if(t&&!seen[t.toLowerCase()]){seen[t.toLowerCase()]=1;o.push(t)}}
  if(data){var nm=new Date();nm=nm.getHours()*60+nm.getMinutes();
    for(var i=0;i<data.events.length;i++){var e=data.events[i],st=mins(e.t),pr=e.t.split(/[–-]/),en=pr[1]?mins(pr[1]):(st!==null?st+60:null);if(st!==null&&st<=nm&&en>nm)add(e.w)}
    for(i=0;i<data.donow.length;i++)add(data.donow[i])}
  if(week&&week.lists&&week.lists.work)for(i=0;i<week.lists.work.length;i++)add(week.lists.work[i]);
  return o.slice(0,6)}
function fPick(){var o=fOpts(),h='';if(!fSel&&o.length)fSel=o[0];
  for(var i=0;i<o.length;i++)h+='<span class="'+(o[i]==fSel?'on':'')+'" data-t="'+esc(o[i]).replace(/"/g,'&quot;')+'">'+esc(o[i])+'</span>';
  h+='<span data-t="__other" class="'+(fSel&&o.indexOf(fSel)<0?'on':'')+'">'+(fSel&&o.indexOf(fSel)<0?esc(fSel):'Something else&hellip;')+'</span>';
  $('fopts').innerHTML=h;
  var sp=$('fopts').getElementsByTagName('span');for(i=0;i<sp.length;i++)sp[i].onclick=function(){var t=this.getAttribute('data-t');
    if(t=='__other'){var v=window.prompt('What are you focusing on?','');if(v)fSel=v}else fSel=t;fPick()};
}
function fOpen(){$('focus').style.display='block';$('focus').className='';if(F&&F.end){fShowRun()}else{$('fpick').style.display='block';$('frun').style.display='none';fSel='';fPick()}}
function fClose(){if(F&&F.end&&!window.confirm('Stop this focus session?'))return;F=null;fSave();clearInterval(fTick);$('focus').style.display='none'}
function beep(){try{if(!actx)return;var t=actx.currentTime;[0,.35,.7].forEach(function(d){var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=660;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.3,t+d+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d+.3);o.start(t+d);o.stop(t+d+.32)})}catch(e){}}
function fStart(){if(!fSel)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(AC&&!actx){actx=new AC();var b=actx.createBuffer(1,1,22050),s0=actx.createBufferSource();s0.buffer=b;s0.connect(actx.destination);s0.start(0)}}catch(e){}
  F={task:fSel,len:fLen*60000,end:Date.now()+fLen*60000,paused:0,rang:0};fSave();fShowRun()}
function fShowRun(){$('fpick').style.display='none';$('frun').style.display='block';$('ftask').textContent=F.task;$('fmsg').textContent='';clearInterval(fTick);fDraw();fTick=setInterval(fDraw,1000)}
function fDraw(){if(!F)return;var left=F.paused?F.paused:F.end-Date.now();if(left<0)left=0;var m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
  $('ftime').textContent=m+':'+pad(s);$('fprog').style.width=Math.min(100,(1-left/F.len)*100)+'%';$('fpause').textContent=F.paused?'Resume':'Pause';
  if(left==0&&!F.rang){F.rang=1;fSave();beep();$('focus').className='ding';$('fmsg').textContent='Time! Tap Done to bank it, or +5 min to keep going.'}}
$('focusbtn').onclick=fOpen;$('fgo').onclick=fStart;$('fexit').onclick=fClose;
$('fpause').onclick=function(){if(!F)return;if(F.paused){F.end=Date.now()+F.paused;F.paused=0}else{F.paused=Math.max(0,F.end-Date.now())}fSave();fDraw()};
$('fmore').onclick=function(){if(!F)return;if(F.paused)F.paused+=300000;else F.end=Math.max(F.end,Date.now())+300000;F.len+=300000;F.rang=0;$('focus').className='';$('fmsg').textContent='';fSave();fDraw()};
$('fdone').onclick=function(ev){if(!F)return;var mins0=Math.max(1,Math.round((F.len-(F.paused||Math.max(0,F.end-Date.now())))/60000));
  send('FOCUS · '+mins0+' min · '+F.task);addPts(15,'focus '+mins0+' min',(ev&&ev.clientX)||500,(ev&&ev.clientY)||300);
  $('fmsg').textContent='Banked: '+mins0+' min on '+F.task+'. +15 pts';F=null;fSave();clearInterval(fTick);setTimeout(function(){$('focus').style.display='none'},2500)};
var fl=$('focus').querySelectorAll('.flen span');for(var fi=0;fi<fl.length;fi++)fl[fi].onclick=function(){fLen=+this.getAttribute('data-m');for(var j=0;j<fl.length;j++)fl[j].className=fl[j]==this?'on':''};
if(F&&F.end)setTimeout(fOpen,1500);
</script>
</body></html>
