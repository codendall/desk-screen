<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Desk">
<title>Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* iPad desk view. Reads the Today page (index.html), which the morning task updates,
   and redraws it for a colour backlit screen with a live clock and now/next.
   Written for Safari 12 (iPad Air): no flex gap, no optional chaining. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#f6f1e9}
#stage{position:absolute;left:50%;top:50%;width:1024px;height:768px;-webkit-transform-origin:0 0;transform-origin:0 0;
  background:#f6f1e9;color:#1f1d1a;font-family:Inter,-apple-system,Helvetica,Arial,sans-serif;padding:26px 30px 22px}
.top{display:-webkit-flex;display:flex;-webkit-align-items:flex-end;align-items:flex-end;-webkit-justify-content:space-between;justify-content:space-between;margin-bottom:18px}
.clock{font-family:Fraunces,Georgia,serif;font-size:52px;font-weight:700;line-height:.9;letter-spacing:-2px}
.date{font-size:20px;font-weight:600;color:#6d655c;margin-top:8px}
.wx{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;background:#fff;border-radius:22px;padding:12px 20px 12px 12px;box-shadow:0 2px 10px rgba(60,40,20,.08)}
.wx svg{width:120px;height:86px;margin-right:12px}
.wx .lv{font-size:15px;font-weight:600;color:#6d655c;text-transform:uppercase;letter-spacing:1px}
.wx .tp{font-family:Fraunces,Georgia,serif;font-size:46px;font-weight:700;color:#e0603f;line-height:1}
.wx .cd{font-size:15px;color:#3a352f;margin-top:4px;max-width:270px}
.grid{display:-webkit-flex;display:flex;height:520px}
.col{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.l{width:540px;margin-right:24px}.r{-webkit-flex:1;flex:1}
.card{background:#fff;border-radius:22px;padding:16px 20px;box-shadow:0 2px 10px rgba(60,40,20,.08);margin-bottom:16px}
h2{font-size:13px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#9a8f83;margin-bottom:10px;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between}
h2 .n{background:#2f5bea;color:#fff;border-radius:10px;padding:1px 9px;letter-spacing:0}
.ev{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:9px 10px;border-radius:14px;margin:0 -10px}
.ev .t{width:128px;font-weight:600;font-size:16px;color:#6d655c;font-variant-numeric:tabular-nums}
.ev .w{font-size:19px;font-weight:500;-webkit-flex:1;flex:1}
.ev.home .w,.ev.home .t{color:#2f5bea}
.ev.past{opacity:.35}
.ev.now{background:#fde7df}.ev.now .t{color:#e0603f}
.ev .tag{font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;margin-left:8px;background:#ffe27a;color:#3a2f00;white-space:nowrap}
.ev .tag.r{background:#e0603f;color:#fff}
.ev .badge{font-size:12px;font-weight:700;color:#fff;background:#e0603f;border-radius:8px;padding:2px 8px;margin-left:8px;white-space:nowrap}
.ev .badge.next{background:#2f5bea}
.empty{font-size:18px;color:#9a8f83;padding:8px 0}
.tom{-webkit-flex:1;flex:1;overflow:hidden}
.tom p{font-size:15px;line-height:1.4;margin-bottom:6px}
.tom b{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;background:#d9f2df;color:#1e6b34;border-radius:7px;padding:2px 8px;margin-right:6px}
.tom .hot{background:#e0603f;color:#fff;border-radius:6px;padding:0 6px}
ol{list-style:none}
ol li{font-size:18px;font-weight:500;line-height:1.3;padding:8px 0 8px 40px;position:relative;border-top:1px solid #f0e9df}
ol li:first-child{border-top:0}
ol li:before{content:attr(data-n);position:absolute;left:0;top:7px;width:28px;height:28px;border-radius:50%;background:#e0603f;color:#fff;font-size:14px;font-weight:700;text-align:center;line-height:28px}
.chips span{display:inline-block;background:#eef2fe;color:#2443b5;border-radius:12px;padding:5px 11px;font-size:15px;font-weight:500;margin:0 6px 7px 0}
.due li{list-style:none;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:6px 0;font-size:17px}
.due .d{width:74px;font-weight:700;font-size:15px;color:#6d655c}
.due .soon .d{color:#e0603f}
.due .w{-webkit-flex:1;flex:1}
.due .in{font-size:13px;color:#9a8f83;margin-left:8px;white-space:nowrap}
.foot{position:absolute;left:30px;right:30px;bottom:12px;font-size:12px;color:#b0a597;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between}
.done{opacity:.35;text-decoration:line-through}
ol li.done:before{content:'\2713';background:#3a9a5b}
.chips span.done{background:#e6f4ea;color:#3a9a5b}
.tap{-webkit-tap-highlight-color:rgba(224,96,63,.15);cursor:pointer}
.hint{font-size:11px;color:#b0a597;letter-spacing:0;text-transform:none;font-weight:500}
</style></head><body>
<div id="stage">
  <div class="top">
    <div><div class="clock" id="date"></div><div class="date" id="sub"></div></div>
    <div class="wx" id="wx"></div>
  </div>
  <div class="grid">
    <div class="col l">
      <div class="card" style="-webkit-flex:1;flex:1;overflow:hidden"><h2><span>Today</span><span id="nextin"></span></h2><div id="today"></div></div>
      <div class="card tom" id="tom" style="margin-bottom:0;max-height:196px"></div>
    </div>
    <div class="col r">
      <div class="card"><h2><span>Do now</span><span class="hint">tap to tick</span></h2><ol id="donow"></ol></div>
      <div class="card"><h2><span>Reply today</span><span class="n" id="rn">0</span></h2><div class="chips" id="reply"></div></div>
      <div class="card" style="margin-bottom:0;-webkit-flex:1;flex:1"><h2><span>Due soon</span></h2><ul class="due" id="due"></ul></div>
    </div>
  </div>
  <div class="foot"><span id="upd"></span><span id="chk"></span></div>
</div>
<script>
var MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function $(id){return document.getElementById(id)}
function txt(el){return el?el.textContent.replace(/\s+/g,' ').trim():''}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function pad(n){return ('0'+n).slice(-2)}
function mins(hm){var m=/(\d{1,2}):(\d{2})/.exec(hm);return m?(+m[1])*60+(+m[2]):null}
function fit(){var s=Math.min(window.innerWidth/1024,window.innerHeight/768);var t='scale('+s+') translate(-50%,-50%)';$('stage').style.webkitTransform=t;$('stage').style.transform=t}
var data=null;
function parse(html){
  var d=new DOMParser().parseFromString(html,'text/html');
  var o={date:txt(d.querySelector('h1')),events:[],tom:'',donow:[],reply:[],rn:'',due:[]};
  var svg=d.querySelector('.wxbox svg');o.svg=svg?svg.outerHTML:'';
  var lv=d.querySelector('.wxt .lv'),tp=d.querySelector('.wxt .tp'),wxt=d.querySelector('.wxt');
  o.leave=txt(lv);o.temp=txt(tp);
  var cd='';if(wxt){var parts=wxt.innerHTML.split(/<br\s*\/?>/i);if(parts[1]){var tmp=document.createElement('div');tmp.innerHTML=parts[1];cd=txt(tmp)}}o.cond=cd;
  var st=d.querySelector('.stamp');o.upd='';if(st){var m=/Updated\s+\d{1,2}:\d{2}/.exec(st.textContent);if(m)o.upd=m[0]}
  var notes=d.querySelectorAll('.stamp > b');o.note=notes.length?txt(notes[0]):'';
  var evs=d.querySelectorAll('.ev');for(var i=0;i<evs.length;i++){var e=evs[i];var w=e.querySelector('.w');var flags=[];
    var fl=w?w.querySelectorAll('.flag'):[];for(var j=0;j<fl.length;j++){flags.push({t:txt(fl[j]),y:/\by\b/.test(fl[j].className)})}
    var wc=w?w.cloneNode(true):null;if(wc){var ff=wc.querySelectorAll('.flag');for(var k=0;k<ff.length;k++)ff[k].parentNode.removeChild(ff[k])}
    o.events.push({t:txt(e.querySelector('.t')),w:txt(wc),home:/\bhome\b/.test(e.className),flags:flags})}
  var tom=d.querySelector('.tom');o.tom=tom?tom.innerHTML:'';
  var li=d.querySelectorAll('ol li');for(i=0;i<li.length;i++)o.donow.push(txt(li[i]));
  var rp=d.querySelector('.reply');if(rp)o.reply=txt(rp).split(' · ');
  var rn=d.querySelector('h2 .n');o.rn=txt(rn);
  var ul=d.querySelectorAll('ul li');for(i=0;i<ul.length;i++){var sp=ul[i].querySelector('span');var dd=txt(sp);var rest=txt(ul[i]).slice(dd.length).trim();o.due.push({d:dd,w:rest,soon:/\bsoon\b/.test(ul[i].className)})}
  return o;
}
function daysUntil(label){
  var m=/(\w{3})\s+(\d{1,2})/.exec(label);if(!m)return null;var now=new Date();var dn=+m[2];
  var t=new Date(now.getFullYear(),now.getMonth(),dn);if(t<new Date(now.getFullYear(),now.getMonth(),now.getDate()))t=new Date(now.getFullYear(),now.getMonth()+1,dn);
  return Math.round((t-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
}
var TICK={};try{TICK=JSON.parse(localStorage.getItem('deskTicks')||'{}')}catch(e){TICK={}}
function saveT(){try{localStorage.setItem('deskTicks',JSON.stringify(TICK))}catch(e){}}
function key(k){return k.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function bindTicks(){var els=document.querySelectorAll('[data-k]');for(var i=0;i<els.length;i++){(function(el){var k=el.getAttribute('data-k');if(TICK[k])el.className+=' done';
  el.onclick=function(){if(TICK[k]){delete TICK[k];el.className=el.className.replace(/\s*done/g,'')}else{TICK[k]=Date.now();el.className+=' done'}saveT()}})(els[i])}}
function render(){
  var now=new Date();
  if(!data){$('date').textContent='';return}
  $('date').textContent=data.date;$('sub').textContent=data.note||'';
  $('wx').innerHTML=data.svg+'<div><div class="lv">'+esc(data.leave)+'</div><div class="tp">'+esc(data.temp)+'</div><div class="cd">'+esc(data.cond)+'</div></div>';
  var nm=now.getHours()*60+now.getMinutes(),h='',nextShown=false,nextIn='';
  for(var i=0;i<data.events.length;i++){var e=data.events[i];var s=mins(e.t);var parts=e.t.split(/[–-]/);var en=parts[1]?mins(parts[1]):(s!==null?s+60:null);
    var cls='ev'+(e.home?' home':''),badge='';
    if(s!==null&&en!==null&&nm>=en)cls+=' past';
    else if(s!==null&&nm>=s&&nm<en){cls+=' now';badge='<span class="badge">Now</span>'}
    else if(s!==null&&!nextShown&&s>nm){nextShown=true;var dm=s-nm;badge='<span class="badge next">Next</span>';nextIn=dm<60?'in '+dm+' min':'in '+Math.floor(dm/60)+' h '+pad(dm%60)}
    var tags='';for(var j=0;j<e.flags.length;j++)tags+='<span class="tag'+(e.flags[j].y?'':' r')+'">'+esc(e.flags[j].t)+'</span>';
    h+='<div class="'+cls+'"><div class="t">'+esc(e.t)+'</div><div class="w">'+esc(e.w)+tags+badge+'</div></div>'}
  $('today').innerHTML=h||'<div class="empty">Nothing else today</div>';$('nextin').textContent=nextIn;
  var tomh=(data.tom||'').replace(/<span style="[^"]*">/g,'<span class="hot">').split(/<br\s*\/?>/i).map(function(p){return '<p>'+p+'</p>'}).join('');
  $('tom').innerHTML='<h2><span>Coming up</span></h2>'+tomh;
  h='';for(i=0;i<data.donow.length;i++)h+='<li class="tap" data-k="'+esc(key(data.donow[i]))+'" data-n="'+(i+1)+'">'+esc(data.donow[i])+'</li>';$('donow').innerHTML=h;
  $('rn').textContent=data.rn||data.reply.length;h='';for(i=0;i<data.reply.length;i++)if(data.reply[i])h+='<span class="tap" data-k="'+esc(key(data.reply[i]))+'">'+esc(data.reply[i])+'</span>';$('reply').innerHTML=h;
  h='';for(i=0;i<data.due.length;i++){var u=data.due[i];var dd=daysUntil(u.d);var inn=dd===null?'':dd===0?'today':dd===1?'tomorrow':'in '+dd+' days';
    h+='<li class="tap '+(u.soon?'soon':'')+'" data-k="'+esc(key(u.w))+'"><span class="d">'+esc(u.d)+'</span><span class="w">'+esc(u.w)+'</span><span class="in">'+inn+'</span></li>'}
  $('due').innerHTML=h;
  $('upd').textContent=data.upd?data.upd+' by the morning brief':'';bindTicks();
}
function load(){
  var x=new XMLHttpRequest();x.open('GET','index.html?t='+Date.now(),true);
  x.onload=function(){if(x.status==200){try{data=parse(x.responseText)}catch(e){}}render();var d=new Date();$('chk').textContent='Checked '+pad(d.getHours())+':'+pad(d.getMinutes())};
  x.onerror=function(){render()};x.send();
}
window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,300)});
fit();load();setInterval(render,30*1000);setInterval(load,10*60*1000);
// Reload the whole page once a night so any design update arrives.
setTimeout(function(){location.reload()},(function(){var n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,4,0);return t-n})());
</script>
</body></html>
